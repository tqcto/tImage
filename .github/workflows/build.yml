name: Build tImage

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.kind }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            kind: shared
            shared: "ON"
            generator: Visual Studio 17 2022
            build_dir: build/ci-windows-shared
          - os: windows-2022
            kind: static
            shared: "OFF"
            generator: Visual Studio 17 2022
            build_dir: build/ci-windows-static
          - os: ubuntu-22.04
            kind: shared
            shared: "ON"
            generator: Ninja
            build_dir: build/ci-linux-shared
          - os: ubuntu-22.04
            kind: static
            shared: "OFF"
            generator: Ninja
            build_dir: build/ci-linux-static
          - os: macos-13
            kind: shared
            shared: "ON"
            generator: Ninja
            build_dir: build/ci-macos-shared
          - os: macos-13
            kind: static
            shared: "OFF"
            generator: Ninja
            build_dir: build/ci-macos-static

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure
        shell: bash
        run: >-
          cmake -S .
          -B "${{ matrix.build_dir }}"
          -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DTIMAGE_ENABLE_OPENMP=ON
          -DTIMAGE_BUNDLE_STATIC_DEPENDENCIES=${{ matrix.shared == 'OFF' && runner.os == 'Windows' && 'ON' || 'OFF' }}
          ${{ runner.os == 'Windows' && '-A x64' || '' }}

      - name: Build tImage
        shell: bash
        run: cmake --build "${{ matrix.build_dir }}" --config Release --target tImage --parallel

      - name: Collect Windows libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/include | Out-Null
          Copy-Item -Recurse -Force include/* artifact/include/
          $configurationDir = Join-Path '${{ matrix.build_dir }}' 'Release'
          Get-ChildItem -Path $configurationDir -File |
            Where-Object { $_.Name -in @('tImage.dll', 'tImage.lib') } |
            Copy-Item -Destination artifact -Force

      - name: Collect Linux libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifact/include
          cp -R include/. artifact/include/
          find "${{ matrix.build_dir }}" -type f \( -name 'libtImage.so*' -o -name 'libtImage.a' \) -exec cp -f {} artifact/ \;

      - name: Collect macOS libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifact/include
          cp -R include/. artifact/include/
          find "${{ matrix.build_dir }}" -type f \( -name 'libtImage.dylib' -o -name 'libtImage.a' \) -exec cp -f {} artifact/ \;

      - name: Verify library artifact
        shell: bash
        run: |
          test -n "$(find artifact -maxdepth 1 -type f | head -n 1)"
          find artifact -maxdepth 2 -type f -print

      - name: Upload library artifact
        uses: actions/upload-artifact@v5
        with:
          name: tImage-${{ matrix.os }}-${{ matrix.kind }}
          path: artifact
          if-no-files-found: error

  build-wasm:
    name: ubuntu-22.04 / wasm
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure Wasm
        shell: bash
        run: >-
          emcmake cmake -S .
          -B build/ci-wasm
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DTIMAGE_ENABLE_OPENMP=OFF

      - name: Build Wasm library
        shell: bash
        run: cmake --build build/ci-wasm --target tImage --parallel

      - name: Collect Wasm library
        shell: bash
        run: |
          mkdir -p artifact/include
          cp -R include/. artifact/include/
          find build/ci-wasm -type f -name 'libtImage.a' -exec cp -f {} artifact/ \;
          test -f artifact/libtImage.a
          find artifact -maxdepth 2 -type f -print

      - name: Upload Wasm library artifact
        uses: actions/upload-artifact@v5
        with:
          name: tImage-ubuntu-22.04-wasm
          path: artifact
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: tImage-*
          path: release-assets

      - name: Package build artifacts
        shell: bash
        run: |
          for directory in release-assets/tImage-*; do
            archive="${directory##*/}.zip"
            (cd "$directory" && zip -qr "../$archive" .)
          done
          ls -lh release-assets/*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*.zip
          --title "${{ github.ref_name }}"
          --generate-notes
